<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bollicine & Co. | Gondola Experiences</title><meta name="description" content="Private Gondola experiences at Bollicine & Co., Ingolstadt Village. Champagne, winter aperitivo and intimate dining."><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;--bg:#f7f3eb;--ink:#293d34;--muted:#686c61;--line:#cfc7b6;--gold:#92703e;--panel:#fffdf7;background:var(--bg);color:var(--ink);font:16px/1.65 Arial,sans-serif;transition:background .3s,color .3s}button,a{ -webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}header{padding:22px 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:20px}.brand{font-family:Georgia,serif;letter-spacing:.04em;font-size:23px;line-height:1.1}.brand small{display:block;font:9px Arial;letter-spacing:.3em;margin-top:9px}nav{display:flex;gap:5px}nav button,.styles button{background:none;color:var(--ink);border:1px solid transparent;padding:7px 11px;font-size:12px;letter-spacing:.08em}button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}.styles{display:flex;justify-content:center;gap:10px;padding:16px;border-bottom:1px solid var(--line)}.styles button{font-size:11px}.hero{max-width:1050px;margin:auto;padding:64px 28px 45px;text-align:center;position:relative;overflow:hidden}.eyebrow{text-transform:uppercase;color:var(--gold);font-size:10px;letter-spacing:.27em;font-weight:bold}h1,h2,h3{font-family:Georgia,serif;font-weight:normal}h1{font-size:clamp(44px,8vw,84px);line-height:1.08;margin:22px auto;max-width:800px}h1 em{font-weight:normal;color:var(--gold)}.intro{color:var(--muted);max-width:510px;margin:20px auto;font-size:15px}.motif{width:86px;height:90px;margin:0 auto 22px;color:var(--gold)}.jump{display:inline-block;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--gold);padding:9px 0;font-size:12px;letter-spacing:.1em}main{max-width:900px;margin:auto;padding:15px 26px 70px}.section{border-top:1px solid var(--line);padding:36px 0 14px;scroll-margin-top:20px}.section-head{display:flex;gap:22px;align-items:baseline}.num{font-family:Georgia;font-style:italic;color:var(--gold);font-size:22px}h2{font-size:32px;margin:0 0 12px}.section-note{color:var(--muted);font-size:13px;margin:0 0 26px 48px}.offer{border-bottom:1px solid var(--line)}summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:20px;padding:23px 0}summary::-webkit-details-marker{display:none}summary .name{font-family:Georgia,serif;font-size:24px;flex:1}summary .price{color:var(--gold);font-size:16px;white-space:nowrap}summary .plus{font-size:23px;color:var(--gold);width:18px;font-weight:normal}details[open] .plus{transform:rotate(45deg)}.body{padding:0 40px 27px 0;max-width:710px;animation:reveal .25s ease}.body p{margin:0 0 18px;color:var(--muted);font-size:15px}.body h4{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin:25px 0 8px}.body .facts{color:var(--ink)}.feature-tag{font:9px Arial;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:6px}.contact{margin-top:46px;padding:36px;background:var(--panel);border:1px solid var(--line)}.contact h2{font-size:30px}.contact p{font-size:14px;color:var(--muted)}.contact a{display:block;color:var(--ink);text-decoration:none;overflow-wrap:anywhere;padding:5px 0}.contact a:hover{text-decoration:underline}footer{text-align:center;font-size:10px;letter-spacing:.18em;color:var(--muted);padding:30px;border-top:1px solid var(--line)}a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:5px}@keyframes reveal{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}@media(max-width:550px){header{padding:20px}.brand{font-size:20px}.hero{padding:42px 24px 35px}h2{font-size:28px}.section-note{margin-left:0}summary{gap:10px}summary .name{font-size:21px}summary .price{font-size:14px}.body{padding-right:0}.contact{padding:25px}.styles{gap:3px}.styles button{font-size:10px;padding:6px 8px}}@media print{nav,.styles,.jump{display:none}body,.body{display:block}details{break-inside:avoid}.hero{padding:20px}h1{font-size:42px}}
.copy-email{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:var(--gold);padding:4px 0 12px;font-size:12px}.copy-email svg{width:13px;height:13px}.copy-email:hover{text-decoration:underline}.copy-status{display:block;font-size:12px;color:var(--muted)}</style></head><body><header><div class="brand">Bollicine & Co.<small>CHAMPAGNE BAR · INGOLSTADT VILLAGE</small></div><nav aria-label="Language"><button data-lang="de">DE</button><button data-lang="en">EN</button></nav></header><div id="content"></div><script>
const data={de:{eyebrow:'Private Momente · Italienischer Genuss',title:'Ihre Gondel.<br><em>Besondere Momente.</em>',intro:'Champagner, italienische Köstlichkeiten und Zeit füreinander. Entdecken Sie Ihre persönliche Auszeit bei Bollicine & Co.',explore:'ERLEBNISSE ENTDECKEN ↓',sections:['Gondel-Pakete','Ihre private Feier','Besondere Genussmomente'],note:'Die Gondel gehört ganz Ihnen – bei jedem Paket für bis zu 2 Stunden exklusiv reserviert.',included:'Im Paket enthalten',optional:'Auf Anfrage · gegen Aufpreis',offers:[['Moët Paket','395 €','Ein besonderer Moment verdient prickelnde Begleitung. Genießen Sie Moët Brut in der stimmungsvollen Atmosphäre unserer Gondel, teilen Sie italienische Köstlichkeiten und lassen Sie den Alltag für eine Weile hinter sich. Für einen besonderen Anlass – oder einfach, um das Zusammensein zu feiern.','Eine Magnumflasche Moët Brut (1,5 l), begleitet von einer feinen Auswahl an Schinken und Käse, mit hauchdünn auf der Berkel geschnittenem Schinken, dazu Oliven und Brot.'],['Glühwein Paket','125 €','Draußen liegt Winter in der Luft, drinnen wartet ein gemütlicher Genussmoment. Machen Sie es sich in unserer Gondel bequem und genießen Sie duftenden Glühwein und süße Winterköstlichkeiten – für entspannte Gespräche und gemeinsame Zeit.','2 l Glühwein, gebrannte Mandeln/Nüsse, Lebkuchen oder Vanillekipferl, Schokofrüchte.'],['Aperol Tower Paket','195 €','Ein Hauch Italien, gute Gesellschaft und ein Aperitivo, der zum Teilen einlädt. Unser Aperol Tower steht im Mittelpunkt Ihrer Runde, dazu wird Pinsa zum gemeinsamen Genießen serviert. Anstoßen, ins Gespräch kommen und den Moment genießen – in Ihrer ganz privaten Gondel.','Ein Aperol Tower mit 10 Drinks, wahlweise auch alkoholfrei, begleitet von Pinsa zum Teilen und Genießen.'],['Premium Champagne Experience','995 €','Manche Anlässe verdienen einen außergewöhnlichen Rahmen. Wählen Sie Ihren Champagner aus vier renommierten Häusern und genießen Sie ihn mit Austern, Kaviar und Focaccia. Ihre exklusiv reservierte Gondel bietet den privaten Rahmen, um auf besondere Momente anzustoßen und sie in aller Ruhe auszukosten.','Eine Flasche Champagner (0,75 l) nach Wahl: Dom Pérignon, La Grande Dame, Krug oder Armand de Brignac, begleitet von Austern, Kaviar und Focaccia.']],celebration:['Geburtstage, Jubiläen & Weihnachtsfeiern','Ein Geburtstag im Kreis Ihrer Liebsten, ein Jubiläum, eine Verlobung oder ein festliches Beisammensein in der Weihnachtszeit – besondere Anlässe verdienen Zeit und Aufmerksamkeit.','Ob private Feier, Weihnachtsfeier mit Ihrem Team oder kleine Firmenveranstaltung: Wir gestalten mit Ihnen ein persönliches Fest, bei dem Sie das Zusammensein mit Ihren Gästen genießen können. Wählen Sie dafür unsere Gondel, das Glashaus oder unser Catering für Ihre Veranstaltung.','Das Basispaket · 35 € pro Person','Ein Prosecco oder Aperitif zur Begrüßung, eine Fingerfood-Platte und eine auf Ihren Anlass abgestimmte Basisdekoration.','Ein warmes Menü nach Absprache, eine personalisierte Torte, erweiterte Blumendekoration, ein Champagner-Upgrade, ein Fotograf sowie musikalische Wünsche.','Für Feiern in der Gondel: Exklusive Reservierung ab 6 Personen, Mindestdauer 2 Stunden.'],romantic:['Ein Abend, der nur Ihnen beiden gehört. In Ihrer exklusiv reservierten Gondel schaffen Kerzenlicht und Blumen eine intime Atmosphäre – für einen besonderen Jahrestag, einen Heiratsantrag oder einfach Zeit zu zweit.','Im Vorfeld besprechen wir Ihre kulinarischen Vorlieben und kreieren darauf abgestimmt Ihr persönliches Fünf-Gänge-Menü – mit Fleisch, Fisch oder vegetarisch. Ihr eigens für diesen Abend gebuchter Koch sorgt mit kulinarischen Showmomenten direkt am Tisch für besondere Akzente. Passend zu den Gängen servieren wir ausgewählte Weine, während Sie sich ganz auf den Genuss und aufeinander konzentrieren.','Ihr Erlebnis · 495 € für zwei Personen','Ein individuell abgestimmtes Fünf-Gänge-Menü mit korrespondierender Weinbegleitung, Wasser und Kaffee sowie eine stimmungsvolle Dekoration mit Kerzen und Blumen. Die Gondel und Ihr Koch stehen an diesem Abend exklusiv Ihnen beiden zur Verfügung.','19:00–21:30 Uhr','Premium-Champagner, etwa Dom Pérignon oder Krug, sowie musikalische Begleitung oder ein Fotograf – jeweils nach Verfügbarkeit.'],contact:'Reservierung & Kontakt',contactText:'Für Reservierungen, individuelle Wünsche und weitere Informationen zu unseren Angeboten kontaktieren Sie uns gerne.',terms:'Alle Angebote sind im Voraus zu reservieren. Die Zahlung erfolgt bei der Buchung.',couple:'495 € / 2 Pers.',base:'35 € / Pers.'},
en:{eyebrow:'Private moments · Italian flavours',title:'Your gondola.<br><em>Memorable moments.</em>',intro:'Champagne, Italian flavours and time together. Discover your own little escape at Bollicine & Co.',explore:'EXPLORE THE EXPERIENCES ↓',sections:['Gondola Packages','Your Private Celebration','Signature Experiences'],note:'The gondola is yours alone – exclusively reserved for up to 2 hours with every package.',included:'Your package includes',optional:'On request · at an additional charge',offers:[['Moët Package','€395','Some moments deserve a little sparkle. Settle into the inviting atmosphere of our gondola, pour a glass of Moët Brut and share a selection of Italian flavours. Whether you’re marking a special occasion or simply enjoying time together, take a moment to make it memorable.','A magnum of Moët Brut (1.5 l), accompanied by a fine selection of ham and cheese, with ham sliced wafer-thin on our Berkel slicer, served with olives and bread.'],['Glühwein Package','€125','As winter fills the air outside, settle into the warmth of our gondola. Share fragrant mulled wine and seasonal sweet treats, linger over conversation and enjoy a cosy moment together.','2 l of mulled wine, candied almonds/nuts, gingerbread or vanilla crescent biscuits, and chocolate-covered fruit.'],['Aperol Tower Package','€195','A little Italian spirit, your favourite company and an aperitivo made for sharing. Our Aperol Tower brings everyone together, with pinsa served for the table. Raise a glass, let the conversation flow and enjoy the moment in your own private gondola.','An Aperol Tower with 10 drinks, also available as an alcohol-free option, served with pinsa to share.'],['Premium Champagne Experience','€995','Some occasions call for an exceptional setting. Choose your champagne from four celebrated houses and savour it alongside oysters, caviar and focaccia. With the gondola reserved exclusively for you, take your time, raise a glass and give the occasion the attention it deserves.','One bottle of champagne (0.75 l), with a choice of Dom Pérignon, La Grande Dame, Krug or Armand de Brignac, accompanied by oysters, caviar and focaccia.']],celebration:['Birthdays, anniversaries & Christmas parties','A birthday with your favourite people, an anniversary, an engagement or a festive gathering during the Christmas season – special occasions deserve time and care.','Whether you’re bringing together friends, family or colleagues for a private celebration, a team Christmas party or a small corporate event, we’ll help create a personal occasion for you and your guests. Choose our gondola, the glasshouse or our catering service for your event.','The base package · €35 per person','A welcome prosecco or aperitif, a finger food platter and basic decorations suited to your occasion.','A warm menu arranged in advance, a personalised cake, enhanced floral decorations, a champagne upgrade, a photographer and music requests.','For celebrations in the gondola: Exclusive reservation for groups of 6 or more, with a minimum duration of 2 hours.'],romantic:['An evening that belongs entirely to the two of you. Your exclusively reserved gondola, softly lit by candles and decorated with flowers, sets the scene for an anniversary, a proposal or simply some meaningful time together.','Before your visit, we’ll discuss your culinary preferences and create a five-course menu tailored to your tastes, with a choice of meat, fish or vegetarian dishes. A chef dedicated to your evening brings a touch of theatre to the table with culinary show moments, accompanied by wines selected to complement the courses. All that’s left for you to do is savour the food and each other’s company.','Your experience · €495 for two','A five-course menu tailored to your preferences, with wine pairing, water and coffee, complemented by candles and flowers. Both the gondola and your chef are exclusively yours for the evening.','7:00–9:30 pm','Premium champagne, such as Dom Pérignon or Krug, musical accompaniment or a photographer — subject to availability.'],contact:'Reservations & Contact',contactText:'For reservations, personal requests and further information about our experiences, please get in touch.',terms:'Advance booking is required for all experiences, with payment due at the time of booking.',couple:'€495 / 2 people',base:'€35 / person'}};
async function copyEmail(button){const email='jeanette.leotta@taglieregroup.com',status=button.nextElementSibling;try{try{await navigator.clipboard.writeText(email)}catch(clipboardError){const field=document.createElement('textarea');field.value=email;field.style.cssText='position:fixed;opacity:0';document.body.appendChild(field);field.select();const copied=document.execCommand('copy');field.remove();if(!copied)throw clipboardError}status.textContent='';button.querySelector('span').textContent=lang==='de'?'Kopiert ✓':'Copied ✓';setTimeout(()=>{if(button.isConnected)button.querySelector('span').textContent=lang==='de'?'E-Mail kopieren':'Copy email address'},2500)}catch(e){status.textContent=lang==='de'?'Bitte markieren und kopieren Sie die E-Mail-Adresse.':'Please select and copy the email address.'}}
let lang='de';const p=s=>`<p>${s}</p>`;const detail=(name,price,body,tag='')=>`<details class="offer"><summary><span class="name">${tag?`<span class="feature-tag">${tag}</span>`:''}${name}</span><span class="price">${price}</span><span class="plus" aria-hidden="true">+</span></summary><div class="body">${body}</div></details>`;const section=(n,title,note,body)=>`<section class="section" id="section-${n}"><div class="section-head"><span class="num">0${n}</span><h2>${title}</h2></div>${note?`<p class="section-note">${note}</p>`:''}${body}</section>`;
function render(){const d=data[lang],c=d.celebration,r=d.romantic;document.documentElement.lang=lang;document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));document.getElementById('content').innerHTML=`<div class="hero"><svg class="motif" viewBox="0 0 90 100" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M4 9L86 1M45 5V28M31 28H59L67 38V79Q67 90 56 90H34Q23 90 23 79V38Z"/><path d="M26 44H64M45 44V70M25 70H65M32 94H58M31 37H59"/><path d="M16 52L11 56M74 52L79 56"/></svg><div class="eyebrow">${d.eyebrow}</div><h1>${d.title}</h1><p class="intro">${d.intro}</p><a class="jump" href="#section-1">${d.explore}</a></div><main>${section(1,d.sections[0],d.note,d.offers.map((o,i)=>detail(o[0],o[1],p(o[2])+`<h4>${d.included}</h4><p class="facts">${o[3]}</p>`,i===3?'Prestige':'')).join(''))}${section(2,d.sections[1],'',detail(c[0],d.base,p(c[1])+p(c[2])+`<h4>${c[3]}</h4><p class="facts">${c[4]}</p><h4>${d.optional}</h4>${p(c[5])}<p class="facts">${c[6]}</p>`))}${section(3,d.sections[2],'',detail('Romantic Dinner for Two',d.couple,p(r[0])+p(r[1])+`<h4>${r[2]}</h4><p class="facts">${r[3]}</p><p class="facts">${r[4]}</p><h4>${d.optional}</h4>${p(r[5])}`))}<section class="contact"><div class="eyebrow">Bollicine & Co.</div><h2>${d.contact}</h2>${p(d.contactText)}<a href="mailto:jeanette.leotta@taglieregroup.com">jeanette.leotta@taglieregroup.com ↗</a><button class="copy-email" type="button" onclick="copyEmail(this)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1"/><path d="M10 3V2H2V10H3"/></svg><span>${lang==='de'?'E-Mail kopieren':'Copy email address'}</span></button><span class="copy-status" role="status" aria-live="polite"></span><a href="tel:+491722622511">+49 172 2622511 ↗</a>${p(d.terms)}</section></main><footer>BOLLICINE & CO. · INGOLSTADT VILLAGE</footer>`}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});render();
</script></body></html>
